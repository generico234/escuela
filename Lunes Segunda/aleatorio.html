<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .juego {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            text-align: center;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitulo {
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .boton-empezar {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: none;
            border-radius: 12px;
            background: #00d084;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-empezar:hover {
            background: #00b872;
            transform: translateY(-2px);
        }

        #resultado {
            min-height: 70px;
            margin-bottom: 25px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.15);
            font-size: 1.15rem;
            line-height: 1.6;
        }

        .elecciones {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .elecciones button {
            flex: 1;
            padding: 18px 10px;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .piedra {
            background: #ff595e;
        }

        .papel {
            background: #1982c4;
        }

        .tijera {
            background: #ffca3a;
            color: #333 !important;
        }

        .elecciones button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .elecciones button:active {
            transform: scale(0.95);
        }

        .resultado-ganaste {
            color: #00ff9d;
            font-weight: bold;
        }

        .resultado-perdiste {
            color: #ff6b6b;
            font-weight: bold;
        }

        .resultado-empate {
            color: #ffd166;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="juego">

        <h1>🎮 Piedra, Papel o Tijera</h1>

        <p class="subtitulo">
            ¡Jugá contra la computadora!
        </p>

        <button class="boton-empezar" onclick="Calculate()">
            🎲 Empezar partida
        </button>

        <p id="resultado">
            Presioná "Empezar partida" para comenzar.
        </p>

        <div class="elecciones">
            <button class="piedra" onclick="eleccion(1)">
                🪨<br>Piedra
            </button>

            <button class="papel" onclick="eleccion(2)">
                📄<br>Papel
            </button>

            <button class="tijera" onclick="eleccion(3)">
                ✂️<br>Tijera
            </button>
        </div>

    </div>

    <script>

        let numero;

        const Calculate = () => {

            let valorSemilla = new Date().getTime();

            valorSemilla ^= valorSemilla << 13;
            valorSemilla ^= valorSemilla >>> 17;
            valorSemilla ^= valorSemilla << 5;
            valorSemilla = valorSemilla >>> 0;

            numero = GenerarEntero(1, 3, valorSemilla);

            document.getElementById("resultado").innerHTML =
                "🤖 La computadora ya eligió.<br>¡Ahora es tu turno!";
        };


        const GenerarEntero = (min, max, seed) =>
            Math.floor(
                (seed / 0x100000000) * (max - min + 1)
            ) + min;


        const eleccion = (a) => {

            if (numero === undefined) {

                document.getElementById("resultado").innerHTML =
                    "⚠️ Primero pulsa «Empezar partida».";

                return;
            }

            let resultado;
            let clase;

            if (a === numero) {
                resultado = "🤝 ¡Empate!";
                clase = "resultado-empate";
            }

            else if (
                (a === 1 && numero === 3) ||
                (a === 2 && numero === 1) ||
                (a === 3 && numero === 2)
            ) {
                resultado = "🎉 ¡Ganaste!";
                clase = "resultado-ganaste";
            }

            else {
                resultado = "😢 Perdiste";
                clase = "resultado-perdiste";
            }

            document.getElementById("resultado").innerHTML +=
                `<br><span class="${clase}">${resultado}</span>`;

            numero = undefined;
        };

    </script>

</body>
</html>
